name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Pinned Jellyfin images (tag + digest). Bump deliberately; see docs/compatibility.md.
  JELLYFIN_12_0: jellyfin/jellyfin:12.0.20260908-012347
  JELLYFIN_12_LATEST: jellyfin/jellyfin:12.4.20261026-211555

jobs:
  build:
    name: Build, unit tests, package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore --severity warn
      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore
      - name: Unit tests
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory test-results
      - name: Package
        run: python3 scripts/package.py
      - name: Package update fixture (next build number, test-only)
        run: |
          VERSION="$(sed -n 's/^version: "\(.*\)"$/\1/p' build.yaml)"
          python3 scripts/package.py --version "${VERSION%.*}.$(( ${VERSION##*.} + 1 ))" --output dist-update
      - name: Script self-test (manifest generator and validator)
        run: |
          VERSION="$(sed -n 's/^version: "\(.*\)"$/\1/p' build.yaml)"
          ZIP="dist/smartmatch_${VERSION}-jf12.zip"
          python3 scripts/update-manifest.py --manifest /tmp/manifest.json --zip "$ZIP" \
            --url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/smartmatch_${VERSION}-jf12.zip"
          python3 scripts/verify-release.py --manifest /tmp/manifest.json --zip-override "$ZIP" --local-zip "$ZIP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: |
            dist/*.zip
            dist/*.md5
            dist/SHA256SUMS.txt
            dist-update/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-test-results
          path: test-results

  integration:
    name: Disposable Jellyfin ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "12.0 (baseline ABI)"
            image: jellyfin/jellyfin:12.0.20260908-012347
            extra: "--ui --catalog --update-zip dist-update/smartmatch_*-jf12.zip"  # glob: one ZIP per folder
          - label: "12.4 (latest 12.x)"
            image: jellyfin/jellyfin:12.4.20261026-211555
            extra: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
      - name: Build offline stub provider (test-only plugin)
        run: dotnet build tests/SmartMatch.TestProvider -c Release
      - name: Install Playwright for the dashboard UI check
        if: contains(matrix.extra, '--ui')
        run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Pull image
        run: docker pull ${{ matrix.image }}
      - name: Run acceptance scenarios
        run: |
          python3 tests/integration/run_integration.py --image ${{ matrix.image }} \
            --zip dist/smartmatch_*-jf12.zip \
            --provider-dll tests/SmartMatch.TestProvider/bin/Release/net10.0/SmartMatch.TestProvider.dll \
            --workdir "$RUNNER_TEMP/it" --report integration-report.json ${{ matrix.extra }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ strategy.job-index }}
          path: |
            integration-report.json
            ${{ runner.temp }}/it/*.log
            ${{ runner.temp }}/it/screenshots/*.png

  arm64-smoke:
    name: ARM64 smoke (AT-16)
    needs: build
    # Native ARM64 runner for public repositories; QEMU emulation otherwise.
    runs-on: ${{ github.event.repository.private && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
      - name: Set up QEMU (emulated runs only)
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build offline stub provider
        run: dotnet build tests/SmartMatch.TestProvider -c Release
      - name: ARM64 smoke
        run: |
          python3 tests/integration/run_integration.py --image ${{ env.JELLYFIN_12_0 }} --platform linux/arm64 --smoke \
            --start-timeout 900 \
            --zip dist/smartmatch_*-jf12.zip \
            --provider-dll tests/SmartMatch.TestProvider/bin/Release/net10.0/SmartMatch.TestProvider.dll \
            --workdir "$RUNNER_TEMP/it" --report arm64-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arm64-smoke
          path: |
            arm64-report.json
            ${{ runner.temp }}/it/*.log
